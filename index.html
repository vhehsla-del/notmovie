<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summertime</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            position: relative;
        }

        .page {
            display: none;
            min-height: 100vh;
            padding: 80px 20px 120px;
            max-width: 640px;
            margin: 0 auto;
        }

        .page.active {
            display: block;
        }

        h2 {
            font-size: 1.8rem;
            margin: 30px 0 15px;
            color: #555;
        }

        p {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .navigation {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .btn {
            padding: 0;
            font-size: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .btn svg {
            width: 30px;
            height: 30px;
            fill: #333;
        }

        .btn:hover:not(:disabled) svg {
            fill: #000;
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.1);
        }

        #prevBtn:hover:not(:disabled) svg {
            transform: translateX(-3px);
        }

        #nextBtn:hover:not(:disabled) svg {
            transform: translateX(3px);
        }

        .content {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ul {
            margin: 15px 0 15px 30px;
        }

        li {
            margin: 8px 0;
            font-size: 1.05rem;
        }

        /* 네모 박스 스타일 */
        .text-box {
            border: 1px solid black;
            padding: 30px;
            margin: 0;
            background-color: white;
            display: block;
        }

        .text-box p {
            font-size: 1rem;
            color: black;
            margin: 0 0 12px 0;
            text-align: justify;
        }

        .text-box p:last-child {
            margin-bottom: 0;
        }

        /* 음악 버튼 - 최상위 레이어 */
        #musicButton {
            position: fixed;
            top: 20px;
            left: 50%;
            margin-left: -15px;
            width: 30px;
            height: 30px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 99999;
            padding: 0;
        }

        #musicButton svg {
            width: 20px;
            height: 20px;
            fill: #333;
            transition: all 0.3s ease;
        }

        #musicButton:hover svg {
            fill: #000;
            transform: scale(1.2);
        }

        #musicButton.playing svg {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <!-- 음악 재생 버튼 -->
    <button id="musicButton" onclick="toggleMusic()" title="음악 재생/정지">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="playIcon">
            <polygon points="6,4 20,12 6,20"/>
        </svg>
    </button>

    <!-- 오디오 파일 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
        <source src="music.mp3" type="audio/mp3">
        <source src="music.wav" type="audio/wav">
    </audio>

    <!-- 페이지 1 -->
    <div class="page active" id="page1">
        <div class="content">
            <img src="1.png" alt="페이지1" style="max-width: 100%; height: auto;">
        </div>
    </div>

    <!-- 페이지 2 -->
    <div class="page" id="page2">
        <div class="content">
            <img src="2.png" alt="페이지2" style="max-width: 100%; height: auto;">
        </div>
    </div>

    <!-- 페이지 3 -->
    <div class="page" id="page3">
        <div class="content">
            <img src="3.png" alt="페이지3" style="max-width: 100%; height: auto;">
        </div>
    </div>

    <!-- 페이지 4 -->
    <div class="page" id="page4">
        <div class="content">
            <img src="4.png" alt="페이지4" style="max-width: 100%; height: auto;">
        </div>
    </div>

    <!-- 하단 네비게이션 -->
    <div class="navigation">
        <button class="btn" id="prevBtn" onclick="changePage(-1)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
            </svg>
        </button>
        <button class="btn" id="nextBtn" onclick="changePage(1)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
            </svg>
        </button>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 4;

        function showPage(pageNum) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            document.getElementById('page' + pageNum).classList.add('active');

            document.getElementById('prevBtn').disabled = (pageNum === 1);
            document.getElementById('nextBtn').disabled = (pageNum === totalPages);

            window.scrollTo(0, 0);
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            showPage(currentPage);
        }

        showPage(1);

        // 음악 재생 기능
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicButton');
        const playIcon = document.getElementById('playIcon');

        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicBtn.classList.add('playing');
                playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
            } else {
                music.pause();
                musicBtn.classList.remove('playing');
                playIcon.innerHTML = '<polygon points="6,4 20,12 6,20"/>';
            }
        }
    </script>
</body>
</html>
